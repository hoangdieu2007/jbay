name: Java CI with Maven

on:
  push:
    branches:
      - main
      - r1

  pull_request:
    branches:
      - main
      - r1

jobs:
  build:

    strategy:
      fail-fast: false #fail on macOS? continue on windows
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jbay-${{ matrix.os }}
          path: |
            target/*.jar